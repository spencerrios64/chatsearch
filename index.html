<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chatsearch</title><script>(()=>{const T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

 file(n,c){this.items.push([this.pre+n,typeof c==='string'?enc.encode(c):c]);return this}
 async generateAsync(){const parts=[],cd=[];let off=0;const w=a=>{parts.push(a);off+=a.length};
  for(const [name,data] of this.items){const nb=enc.encode(name),cr=crc(data);
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,cr,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);

 static async loadAsync(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

</script><style>:root{--bg:#0f1117;--card:#181b24;--bd:#2a2f3d;--tx:#e6e8ee;--mut:#8b92a6;--ac:#7c9cff}

</style></head><body><main><h1>chatsearch</h1><p class="sub">Search every AI chat you ever had, in one place. Ranked (BM25 + fuzzy match). Runs in your browser; nothing is uploaded.</p>
<div class="card"><div class="drop" id="drop">Drop Claude / ChatGPT exports here (conversations.json or the .zip)</div><div id="status" class="note"></div></div>
<div class="card"><div class="row"><input id="q" placeholder="Search... e.g. docker compose error" style="flex:1;min-width:220px"><select id="ai"><option value="">All AIs</option></select><select id="role"><option value="">Any speaker</option><option value="user">Me</option><option value="assistant">AI</option></select></div>
<p class="note" id="count"></p><div id="results"></div></div>
<script>
/* shared core: parse AI chat exports in the browser (nothing is uploaded) */
const Chats = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function textOfClaude(m){
    if (m.text) return m.text;
    if (Array.isArray(m.content)) return m.content.map(c => c.text || '').join('\n');
    return '';
  }
  function parseData(data, name){
    const out = [];
    if (!Array.isArray(data)) data = data && data.conversations ? data.conversations : [data];
    for (const c of data){
      if (!c) continue;
      if (c.chat_messages){ // Claude
        out.push({id:c.uuid||c.id||name+out.length, title:c.name||'(untitled)', ai:'Claude',
          created:c.created_at||'', messages:c.chat_messages.map(m=>({role:m.sender==='human'?'user':'assistant', text:textOfClaude(m)})).filter(m=>m.text)});
      } else if (c.mapping){ // ChatGPT
        const msgs = Object.values(c.mapping).map(n=>n.message).filter(m=>m&&m.content&&m.author&&m.author.role!=='system'&&m.author.role!=='tool')
          .sort((a,b)=>(a.create_time||0)-(b.create_time||0))
          .map(m=>({role:m.author.role, text:(m.content.parts||[]).filter(p=>typeof p==='string').join('\n')})).filter(m=>m.text.trim());
        out.push({id:c.conversation_id||c.id||name+out.length, title:c.title||'(untitled)', ai:'ChatGPT',
          created:c.create_time?new Date(c.create_time*1000).toISOString():'', messages:msgs});
      } else if (Array.isArray(c.messages)){ // generic
        out.push({id:c.id||name+out.length, title:c.title||c.name||'(untitled)', ai:c.ai||c.source||'Other',
          created:c.created||c.created_at||'', messages:c.messages.map(m=>({role:m.role||(m.sender==='human'?'user':'assistant'), text:m.text||m.content||''})).filter(m=>m.text)});
      }
    }
    return out;
  }
  async function loadFiles(fileList){
    let all = [];
    for (const f of fileList){
      if (/\.zip$/i.test(f.name) && window.JSZip){
        const z = await JSZip.loadAsync(f);
        for (const [n, e] of Object.entries(z.files)){
          if (!e.dir && /\.json$/i.test(n) && /conversation|chat/i.test(n)){
            try { all = all.concat(parseData(JSON.parse(await e.async('string')), n)); } catch(_){}
          }
        }
      } else if (/\.jsonl$/i.test(f.name)){
        const lines = (await f.text()).split('\n').filter(Boolean);
        try { all = all.concat(parseData(lines.map(l=>JSON.parse(l)), f.name)); } catch(_){}
      } else {
        try { all = all.concat(parseData(JSON.parse(await f.text()), f.name)); } catch(_){}
      }
    }
    return all;
  }
  const fullText = c => c.messages.map(m=>m.text).join('\n');
  const STOP = new Set('the a an and or but if of to in on at for with from by is are was were be been it this that these those i you he she we they me my your our their as not no so do does did can could would should will just have has had about into than then there what which who how when why also more some any all one'.split(' '));
  const tokens = s => (s.toLowerCase().match(/[a-z0-9À-ɏͰ-Ͽ]{2,}/g)||[]).filter(w=>!STOP.has(w));
  function download(name, content, type){
    const b = content instanceof Blob ? content : new Blob([content], {type: type||'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }
  const PATTERNS = [
    [/sk-[A-Za-z0-9_\-]{20,}/g,'[API_KEY]'],[/AIza[0-9A-Za-z_\-]{30,}/g,'[API_KEY]'],[/gh[pousr]_[A-Za-z0-9]{30,}/g,'[GITHUB_TOKEN]'],
    [/AKIA[0-9A-Z]{16}/g,'[AWS_KEY]'],[/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[EMAIL]'],[/\bhttps?:\/\/[^\s)]+/g,m=>m],
    [/(?<!\d)\+?\d[\d\s().-]{8,}\d(?!\d)/g,'[PHONE]'],[/\b(?:\d[ -]*?){13,16}\b/g,'[CARD]']
  ];
  const scrub = s => PATTERNS.reduce((t,[re,r])=>t.replace(re,r), s);
  return {esc, parseData, loadFiles, fullText, tokens, download, scrub};
})();
const $ = s => document.querySelector(s);
function dropzone(el, cb){
  el.addEventListener('dragover', e=>{e.preventDefault(); el.classList.add('over');});
  el.addEventListener('dragleave', ()=>el.classList.remove('over'));
  el.addEventListener('drop', e=>{e.preventDefault(); el.classList.remove('over'); cb(e.dataTransfer.files);});
  const inp = document.createElement('input'); inp.type='file'; inp.multiple=true; inp.hidden=true; inp.accept='.json,.jsonl,.zip';
  el.after(inp); el.addEventListener('click', ()=>inp.click()); inp.addEventListener('change', ()=>cb(inp.files));
}


let docs=[], idx=null;
function build(){
  const df={}; let total=0;
  docs.forEach((d,i)=>{d.msgs=d.messages.map((m,j)=>{const t=Chats.tokens(m.text);const tf={};t.forEach(w=>tf[w]=(tf[w]||0)+1);return{i,j,role:m.role,text:m.text,tf,len:t.length}});});
  const all=docs.flatMap(d=>d.msgs);
  all.forEach(m=>{total+=m.len;Object.keys(m.tf).forEach(w=>df[w]=(df[w]||0)+1)});
  idx={all,df,N:all.length,avg:total/Math.max(1,all.length)};
  const ais=[...new Set(docs.map(d=>d.ai))]; $('#ai').innerHTML='<option value="">All AIs</option>'+ais.map(a=>`<option>${a}</option>`).join('');
}
function bm25(m,terms){let s=0;for(const t of terms){const f=m.tf[t]||0;if(!f)continue;const n=idx.df[t]||0;const idf=Math.log(1+(idx.N-n+.5)/(n+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*m.len/idx.avg));}return s;}
function fuzzy(terms,m){ // prefix match fallback
  let s=0;for(const t of terms){if(t.length<4)continue;for(const w in m.tf){if(w!==t&&w.startsWith(t.slice(0,Math.max(4,t.length-2)))){s+=.4;break}}}return s;}
function search(){
  if(!idx)return;const q=$('#q').value.trim();const terms=Chats.tokens(q);const ai=$('#ai').value,role=$('#role').value;
  if(!terms.length){$('#results').innerHTML='';$('#count').textContent='';return}
  const res=[];for(const m of idx.all){const d=docs[m.i];if(ai&&d.ai!==ai)continue;if(role&&m.role!==role)continue;
    const s=bm25(m,terms)+fuzzy(terms,m);if(s>0)res.push([s,m]);}
  res.sort((a,b)=>b[0]-a[0]);$('#count').textContent=res.length+' matching messages';
  const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  $('#results').innerHTML=res.slice(0,40).map(([s,m])=>{const d=docs[m.i];
    let p=m.text.search(re);p=Math.max(0,p-120);const snip=Chats.esc(m.text.slice(p,p+360)).replace(re,'<mark>$1</mark>');
    return `<div class="hit"><b>${Chats.esc(d.title)}</b> <span class="pill">${d.ai}</span> <span class="pill">${m.role==='user'?'me':'ai'}</span> <span class="note">${d.created.slice(0,10)}</span><div>${p>0?'…':''}${snip}…</div></div>`}).join('');
}
dropzone($('#drop'),async fl=>{$('#status').textContent='Reading…';docs=await Chats.loadFiles(fl);build();
  $('#status').textContent=`${docs.length} chats, ${idx.N} messages indexed.`;search();});
$('#q').addEventListener('input',search);$('#ai').onchange=search;$('#role').onchange=search;
</script>
</main><script>(function(){try{
if(document.getElementById('hubbar'))return;
var FILE=location.protocol==='file:',P=location.pathname.split('/').filter(Boolean);
var me=FILE?P[P.length-2]:P[0];
var GROUPS=[['Collect','chatzip chatvault'],['Clean','chatscrub chatdedupe'],['Understand','chatstats chatsearch chatgraph chatbrief'],['Reuse','promptbank'],['Use','chatrelay chatbridge chatcompare chatevals'],['All-in-one','chatpipeline']];
var href=function(t){return '../'+t+'/'+(FILE?'index.html':'')+'#hub'};
var hubHref=FILE?'../index.html':'../chathub/';
function open(){return new Promise(function(res,rej){var r=indexedDB.open('chathub',1);r.onupgradeneeded=function(){r.result.createObjectStore('files',{keyPath:'name'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function store(mode,fn){return open().then(function(d){return new Promise(function(res,rej){var t=d.transaction('files',mode),q=fn(t.objectStore('files'));t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
function list(){return store('readonly',function(s){return s.getAll()})}
function keep(fl){var a=Array.prototype.slice.call(fl||[]).filter(function(f){return /\.(json|jsonl|zip)$/i.test(f.name)});
  return Promise.all(a.map(function(f){return store('readwrite',function(s){return s.put({name:f.name,blob:f,ts:Date.now()})})})).then(refresh)}
document.addEventListener('change',function(e){if(e.target&&e.target.type==='file'&&!e.__hub)keep(e.target.files)},true);
document.addEventListener('drop',function(e){if(!e.__hub&&e.dataTransfer)keep(e.dataTransfer.files)},true);
var st='background:#222736;color:#e6e8ee;border:1px solid #2a2f3d;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer';
var bar=document.createElement('div');bar.id='hubbar';
bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483000;height:34px;display:flex;gap:8px;align-items:center;padding:0 10px;background:#0b0d13;border-bottom:1px solid #2a2f3d;font:13px system-ui,sans-serif;color:#e6e8ee;overflow:hidden;white-space:nowrap';
var opts=GROUPS.map(function(g){return '<optgroup label="'+g[0]+'">'+g[1].split(' ').filter(function(t){return t!==me}).map(function(t){return '<option value="'+t+'">'+t+'</option>'}).join('')+'</optgroup>'}).join('');
bar.innerHTML='<a href="'+hubHref+'" style="color:#7c9cff;font-weight:700;text-decoration:none">chathub</a><span id="hb-n" style="color:#8b92a6;overflow:hidden;text-overflow:ellipsis"></span>'
 +'<button id="hb-load" style="'+st+'" hidden>Load hub chats</button><button id="hb-save" style="'+st+'" hidden>Save hub data</button><button id="hb-clear" style="'+st+'" hidden>Clear</button>'
 +'<select id="hb-go" style="'+st+';margin-left:auto"><option value="">Open these chats in…</option>'+opts+'</select>';
document.body.insertBefore(bar,document.body.firstChild);document.body.style.paddingTop='34px';
function q(id){return document.getElementById(id)}
function fileInput(){return document.querySelector('input[type=file]')}
function dropEl(){return document.querySelector('.drop,[id*=drop]')}
function load(){return list().then(function(items){if(!items.length)return false;var dt=new DataTransfer();items.forEach(function(i){dt.items.add(new File([i.blob],i.name))});
  var inp=fileInput();if(inp){inp.files=dt.files;var ev=new Event('change',{bubbles:true});ev.__hub=1;inp.dispatchEvent(ev);return true}
  var d=dropEl();if(d){var e2=new DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true});e2.__hub=1;d.dispatchEvent(e2);return true}
  return false})}
function refresh(){return list().then(function(items){var n=items.length;
  q('hb-n').textContent=n?n+' file'+(n>1?'s':'')+' in hub: '+items.map(function(i){return i.name}).join(', '):'hub is empty: load an export in any tool and it is shared with all of them';
  q('hb-load').hidden=!(n&&(fileInput()||dropEl()));q('hb-save').hidden=!n;q('hb-clear').hidden=!n})}
q('hb-load').onclick=load;
q('hb-save').onclick=function(){list().then(function(items){items.forEach(function(i){var a=document.createElement('a');a.href=URL.createObjectURL(i.blob);a.download=i.name;a.click()})})};
q('hb-clear').onclick=function(){if(confirm('Remove the shared chats from the hub? Your original files are not touched.'))store('readwrite',function(s){return s.clear()}).then(refresh)};
q('hb-go').onchange=function(){if(this.value)location.href=href(this.value)};
refresh();
if(location.hash==='#hub')setTimeout(function(){load().then(refresh)},500);
}catch(err){console.warn('hubbar',err)}})();
</script>
